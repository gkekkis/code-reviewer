[project]
name = "code-reviewer"
version = "0.1.0"
description = "FastAPI agentic backend with LangGraph and AWS Bedrock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "mangum>=0.15.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.10",
    "langchain-aws>=0.2.0",
    "langchain-openai>=0.3.0",
    "boto3>=1.35.0",
    "tenacity>=9.0.0",
    "openai>=3.28.0",
    "python-dotenv>=1.2.4",
    "azure-identity>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "httpx>=0.27.0",
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "commitizen>=4.19.3",
]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "*/__init__.py"
]

show-fixes = true
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "C",
    "D",
    "E",
    "F",
    "I",
    "N",
    "W",
    "SIM",
    "RSE",
    "C4",
    "TCH",
    "TID252"
]

ignore = [
    "D203",
    "D212",
    "D401",
    "SIM105"
]
[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "E402"
]
"tests/*" = ["D"]

[tool.pytest.ini_options]
pythonpath = ["."]
